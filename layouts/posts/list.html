{{ define "main" }}

<h1>Articles</h1>

<ul class="article-list">
    {{ range .Pages.ByDate.Reverse }}
    <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ with .Date }}
        <span>{{ .Format "January 2, 2006" }}</span>
        {{ end }}
    </li>
    {{ end }}
</ul>

{{ end }}
