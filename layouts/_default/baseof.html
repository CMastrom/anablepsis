<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {{ if .Title }}{{ .Title }} — {{ end }}{{ site.Title }}
    </title>

    <meta name="description"
          content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <div class="site-title">
        <a href="/">{{ site.Title }}</a>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/posts/">Articles</a>
    </nav>
</header>

<main>
    {{ block "main" . }}{{ end }}
</main>

<footer>
    <p>© {{ now.Year }} {{ site.Title }}</p>
    <p>
        Contact:
        <a href="mailto:theeudemian3@gmail.com">
            theeudemian3@gmail.com
        </a>
    </p>
</footer>

</body>
</html>
